<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanto Tetris</title>
<style>
html,body{margin:0;min-height:100%;background:#202936;color:#fff;font-family:monospace}
#boot{padding:24px;text-align:center}
</style>
</head>
<body>
<div id="boot">Loading Kanto Tetris…</div>
<script>
(async()=>{
  try{
    const response=await fetch("game-base.html",{cache:"no-cache"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    let html=await response.text();
    html=html.replace("</body>",'<script src="classical_music.js"></'+'script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById("boot").textContent="Could not load Kanto Tetris: "+err.message;
  }
})();
</script>
</body>
</html>
