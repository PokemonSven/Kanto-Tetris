<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanto Tetris</title>
<style>
html,body{margin:0;min-height:100%;background:#202936;color:#fff;font-family:monospace}
#boot{padding:24px;text-align:center}
</style>
</head>
<body>
<div id="boot">Loading Kanto Tetris…</div>
<script>
(async()=>{
  try{
    const stamp="20260906-scopefix1";
    const [gameResponse,musicResponse]=await Promise.all([
      fetch(`game-base.html?v=${stamp}`,{cache:"no-store"}),
      fetch(`classical_music.js?v=${stamp}`,{cache:"no-store"})
    ]);
    if(!gameResponse.ok) throw new Error("Game HTTP "+gameResponse.status);
    if(!musicResponse.ok) throw new Error("Music HTTP "+musicResponse.status);
    let html=await gameResponse.text();
    const music=await musicResponse.text();
    const needle="initCropEditorEvents();renderDex();renderBadges();renderTeam();renderControlPanels();renderSaveControls();restartRun();";
    if(!html.includes(needle)) throw new Error("Could not locate Kanto Tetris startup hook");
    html=html.replace("TRACK: 1/19 ▶","TRACK: 1/10 ▶");
    html=html.replace(needle,music+"\n\n"+needle);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById("boot").textContent="Could not load Kanto Tetris: "+err.message;
  }
})();
</script>
</body>
</html>
